name: Build and Push Docker Image

on:
  push:
    branches:
      - claude/add-resolved-tab-hESJN
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=resolved-tab,enable=${{ github.ref == 'refs/heads/claude/add-resolved-tab-hESJN' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Built and pushed tags:"
          echo "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Trigger Coolify Deployment
        if: github.ref == 'refs/heads/claude/add-resolved-tab-hESJN'
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.COOLIFY_WEBHOOK }}" ]; then
            echo "COOLIFY_WEBHOOK secret not set, skipping deployment trigger"
            exit 0
          fi

          echo "Triggering Coolify deployment..."
          if [ -n "${{ secrets.COOLIFY_TOKEN }}" ]; then
            HTTP_STATUS=$(curl -s -o /tmp/coolify_response.txt -w "%{http_code}" \
              --max-time 30 \
              --connect-timeout 10 \
              --retry 3 \
              --retry-delay 5 \
              --retry-connrefused \
              -X GET "${{ secrets.COOLIFY_WEBHOOK }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          else
            HTTP_STATUS=$(curl -s -o /tmp/coolify_response.txt -w "%{http_code}" \
              --max-time 30 \
              --connect-timeout 10 \
              --retry 3 \
              --retry-delay 5 \
              --retry-connrefused \
              -X GET "${{ secrets.COOLIFY_WEBHOOK }}")
          fi

          echo "HTTP status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/coolify_response.txt)"

          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "Coolify deployment triggered successfully."
          else
            echo "Warning: Coolify webhook returned HTTP $HTTP_STATUS. Docker image was pushed; deploy may need to be triggered manually."
          fi
